<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>rebecamorais.github.io | Mudamos!</title>
    <meta http-equiv="refresh" content="5;url=https://rebs.com.br">
    <link rel="canonical" href="https://rebs.com.br">
    <style>
      :root {
        --bg-color: #0f172a;
        --text-color: #f8fafc;
        --accent-color: #38bdf8;
        --secondary-color: #94a3b8;
      }

      body {
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: var(--bg-color);
        color: var(--text-color);
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        text-align: center;
        overflow: hidden;
      }

      .container {
        max-width: 600px;
        padding: 2rem;
        animation: fadeIn 0.8s ease-out;
      }

      h1 {
        font-size: 2.5rem;
        margin-bottom: 1rem;
        background: linear-gradient(135deg, var(--accent-color), #818cf8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        font-weight: 800;
      }

      p {
        font-size: 1.125rem;
        color: var(--secondary-color);
        margin-bottom: 2rem;
        line-height: 1.6;
      }

      .loader {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(56, 189, 248, 0.1);
        border-left-color: var(--accent-color);
        border-radius: 50%;
        display: inline-block;
        animation: spin 1s linear infinite;
        margin-bottom: 2rem;
      }

      a {
        color: var(--accent-color);
        text-decoration: none;
        font-weight: 600;
        transition: opacity 0.2s;
        border-bottom: 1px solid transparent;
      }

      a:hover {
        border-bottom-color: var(--accent-color);
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Subtle background glow */
      body::before {
        content: "";
        position: absolute;
        width: 300px;
        height: 300px;
        background: radial-gradient(circle, var(--accent-color), transparent);
        filter: blur(100px);
        opacity: 0.15;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: -1;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="loader"></div>
      <h1>Estamos de casa nova!</h1>
      <p>O Tech Hub agora faz parte do meu novo portal oficial.</p>
      <p>
        Você está sendo redirecionado para
        <strong><a href="https://rebs.com.br">rebs.com.br</a></strong>
      </p>
      <p style="font-size: 0.9rem;">Se o redirecionamento não acontecer automaticamente em 5 segundos, <a href="https://rebs.com.br">clique aqui</a>.</p>
    </div>

    <script>
      setTimeout(() => {
        window.location.href = "https://rebs.com.br";
      }, 2000);
    </script>
  </body>
</html>
