<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
  <style>
    /* Nav override */
    body { max-width: 860px; margin: 0 auto; padding: 0 20px; }
    nav {
      display: flex;
      gap: 1.5rem;
      padding: 1.2rem 0;
      border-bottom: 1px solid #3c3c3c;
      margin-bottom: 2rem;
      font-size: 0.9rem;
    }
    nav a {
      color: #9e9e9e;
      text-decoration: none;
      transition: color 0.2s;
    }
    nav a:hover, nav a.active { color: #8afa8a; }
    .nav-brand {
      font-weight: bold;
      color: #8afa8a !important;
      margin-right: auto;
    }
    footer {
      margin-top: 4rem;
      padding: 2rem 0 1rem;
      border-top: 1px solid #3c3c3c;
      font-size: 0.8rem;
      color: #5a5a5a;
      text-align: center;
    }
    footer a { color: #5a5a5a; }
  </style>
</head>
<body>
  <nav>
    <a class="nav-brand" href="/">rebecamorais.github.io</a>
    <a href="/tutoriais" {% if page.url contains '/tutoriais' %}class="active"{% endif %}>📚 Tutoriais</a>
    <a href="/glossario" {% if page.url contains '/glossario' %}class="active"{% endif %}>📖 Glossário</a>
    <a href="https://rebs.com.br" target="_blank">🌐 rebs.com.br</a>
  </nav>

  <main>
    {{ content }}
  </main>

  <footer>
    <p>
      <a href="https://github.com/rebecamorais">github.com/rebecamorais</a> ·
      <a href="https://www.linkedin.com/in/rebecamoraisc/">LinkedIn</a>
    </p>
  </footer>
</body>
</html>
